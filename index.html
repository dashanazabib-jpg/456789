<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Симулятор Дрифт-Такси: Успеть за 60 секунд</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: rgba(22,33,62,0.8);
      --accent: #00fff5;
      --gold: #ffc107;
      --warning: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

    body { font-family: system-ui, Arial, sans-serif; background: #000; color: #fff; }

    /* Основной контейнер и канвас */
    #gameContainer {
      position: fixed; inset: 0;
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at center, #0b1220 0%, #0a0a0f 40%, #0a0a0f 100%);
    }
    canvas#gameCanvas {
      /* базовая область — 1280x720, далее масштабируем */
      width: 1280px; height: 720px;
      image-rendering: pixelated;
      background: #050507;
      display: block;
      /* чтобы сохранить пропорции на разных экранах (letterbox) */
      max-width: 100vw;
      max-height: 100vh;
      width: min(1280px, 100%);
      height: auto;
      border: 1px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
    }

    /* UI верхняя панель: таймер и деньги */
    #uiTop {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px; align-items: center;
      pointer-events: none;
    }
    #timer {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 52px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0,255,245,.9);
      letter-spacing: 4px;
    }
    #moneyDisplay {
      position: fixed; top: 12px; right: 16px;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
    }

    /* Drift meter */
    #driftMeter {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 360px; height: 20px; background: rgba(0,0,0,.6);
      border: 2px solid #e94560; border-radius: 14px; overflow: hidden;
    }
    #driftFill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #e94560, #ff6b9d, #c44569);
      transition: width .08s linear;
      box-shadow: 0 0 14px rgba(233,69,96,.8);
    }

    /* Мини карта */
    #minimap {
      position: fixed; bottom: 60px; right: 20px;
      width: 130px; height: 130px; border-radius: 50%;
      overflow: hidden; border: 2px solid #00fff5; background: rgba(0,0,0,.6);
    }
    #minimapCanvas { width: 100%; height: 100%; display: block; }

    /* Подсказки управления на ПК */
    #controlsHint {
      position: fixed; top: 10px; left: 10px;
      padding: 8px 12px; border-radius: 8px;
      background: rgba(0,0,0,.4); color: #fff; font-family: monospace;
      font-size: 12px; z-index: 5;
      mix-blend-mode: normal;
    }

    /* Сенсорные кнопки (мобильные) */
    .touchControls { position: fixed; left:0; right:0; bottom:0; height: 26vh; display: none; pointer-events: none; }
    .touchControls.visible { display: block; pointer-events: auto; }
    .tbtn {
      position: absolute; width: 86px; height: 86px; border-radius: 50%;
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.5);
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px;
      user-select: none; -webkit-tap-highlight-color: transparent;
      transition: transform .08s;
    }
    .tbtn:active { transform: scale(0.95); }

    #btnLeft { left: 12px; bottom: 12px; }
    #btnRight { left: 108px; bottom: 12px; }
    #btnGas { right: 12px; bottom: 12px; }
    #btnBrake { right: 108px; bottom: 12px; }

    /* Меню и гараж (простая модальная структура) */
    .menu, .overlay { position: fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index: 20; }
    .menu { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
    .menuCard {
      background: rgba(16,24,40,.95); border: 2px solid #00fff5; border-radius: 12px;
      padding: 20px; min-width: 260px; text-align: center;
    }
    .btn {
      padding: 12px 22px; margin: 8px; font-family: Orbitron, monospace;
      border: 0; border-radius: 6px; cursor: pointer;
      background: linear-gradient(135deg, #1f6feb, #0b3fbf); color: white;
      font-weight: 700;
    }
    .btn.secondary { background: linear-gradient(135deg, #3a3a3a, #1a1a1a); }

    /* Простые, чистые стили для заглушек меню (минимум) */
    .hidden { display: none; }

    /* Адаптация под мобильные (убираем масштабирование страницы) */
    @media (max-width: 800px) {
      #timer { font-size: 40px; }
      #driftMeter { width: 320px; height: 16px; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>

  <div id="uiTop">
    <div id="timer" aria-label="таймер">60</div>
  </div>

  <div id="moneyDisplay">$0</div>

  <div id="driftMeter" aria-label="drift meter">
    <div id="driftFill"></div>
  </div>

  <div id="minimap" aria-label="миникарта">
    <canvas id="minimapCanvas" width="130" height="130"></canvas>
  </div>

  <div id="controlsHint">Управление: ПК — WASD/стрелки, W газ, S ручник, A/D поворот. Моб — тач кнопки; нажимайте для эмуляции газа/ручника/поворота.</div>

  <!-- Сенсорные кнопки (мобильный ввод) -->
  <div class="touchControls" id="touchControls">
    <div class="tbtn" id="btnLeft" title="Поворот влево">◀</div>
    <div class="tbtn" id="btnRight" title="Поворот вправо">▶</div>
    <div class="tbtn" id="btnGas" title="Газ">▲</div>
    <div class="tbtn" id="btnBrake" title="Ручник/торможение">●</div>
  </div>

  <!-- Меню -->
  <div id="mainMenu" class="overlay menu hidden" aria-label="главное меню">
    <div class="menuCard">
      <h2 style="font-family:Orbitron, monospace; margin-bottom: 12px;">Симулятор Дрифт-Такси</h2>
      <p style="margin-bottom:12px;">Успеть за 60 секунд. Подбирай пассажиров и доставляй их, используя дрифт.</p>
      <button class="btn" id="startBtn">Старт</button>
      <button class="btn secondary" id="garageBtn">Гараж</button>
    </div>
  </div>

  <div id="garagePanel" class="overlay menu hidden" aria-label="гараж">
    <div class="menuCard" style="min-width:320px;">
      <h3>Гараж и апгрейды</h3>
      <div id="upgradeGrid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; margin: 10px 0;"></div>
      <button class="btn secondary" id="backFromGarage">Назад</button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay menu hidden" aria-label="пауза">
    <div class="menuCard">
      <h2>ПАУЗА</h2>
      <button class="btn" id="resumeBtn">Продолжить</button>
      <button class="btn secondary" id="pauseToMenuBtn">В меню</button>
    </div>
  </div>

  <div id="endOverlay" class="overlay menu hidden" aria-label="итоги">
    <div class="menuCard" style="min-width:320px;">
      <h2>ИГРА ОКОНЧЕНА</h2>
      <div id="statsGrid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin: 8px 0;"></div>
      <button class="btn" id="playAgainBtn">Ещё заезд</button>
      <button class="btn secondary" id="toMenuBtn">В МЕНЮ</button>
    </div>
  </div>

  <!-- YaGames SDK (Яндекс Игры) -->
  <script src="https://yandex.ru/games/sdk.js"></script>

  <script>
  // Короткая адаптация: единый файл без зависимостей, используем чистый Canvas.
  // Управление, физика и экономика — одинаковы на ПК и мобилках.
  (function () {
    const isMobile = ('ontouchstart' in window) || navigator.userAgent.includes('Mobile');
    const baseW = 1280, baseH = 720;

    const YaSDK = window.YaGames || null;
    let ysdk = null;
    let adManager = null;
    let savedData = null;

    // UI элементы
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapC = document.getElementById('minimapCanvas');
    const minimapCtx = minimapC.getContext('2d');
    const driftFill = document.getElementById('driftFill');
    const moneyDisplay = document.getElementById('moneyDisplay');
    const timerEl = document.getElementById('timer');
    const upgradeGrid = document.getElementById('upgradeGrid');
    const mainMenu = document.getElementById('mainMenu');
    const garagePanel = document.getElementById('garagePanel');
    const endOverlay = document.getElementById('endOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const touchControls = document.getElementById('touchControls');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnGas = document.getElementById('btnGas');
    const btnBrake = document.getElementById('btnBrake');

    // Игровое
